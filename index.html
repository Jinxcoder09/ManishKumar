
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manish Kumar | Founder @ Eyeva AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: ['JetBrains Mono', 'Fira Code', 'Source Code Pro', 'Courier New', 'monospace'],
            },
            colors: {
              terminal: {
                bg: '#0A0E0A',
                surface: '#0D1210',
                card: '#111714',
                borderDim: '#1E2820',
                borderMid: '#243029',
                green: '#00FF41',
                greenDim: '#00C032',
                greenMuted: '#007A20',
                white: '#CDD8CB',
                muted: '#3A4A3C',
                error: '#FF3333',
                warning: '#FFD700',
                info: '#5BB8FF',
              }
            }
          }
        }
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'JetBrains Mono', monospace;
        background-color: #0A0E0A;
        color: #CDD8CB;
        line-height: 1.6;
        overflow-x: hidden;
      }
      
      /* CRT Scanline Effect */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9998;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.025) 0px,
          rgba(0, 0, 0, 0.025) 1px,
          transparent 1px,
          transparent 2px
        );
      }
      
      /* Vignette Effect */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9997;
        background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%);
      }
      
      /* Phosphor Glow */
      .phosphor-glow {
        text-shadow: 0 0 8px #00FF41, 0 0 16px rgba(0,255,65,0.3);
      }
      
      /* Blinking Cursor */
      .cursor {
        display: inline-block;
        width: 10px;
        height: 1em;
        background: #00FF41;
        vertical-align: text-bottom;
        animation: blink 1s step-end infinite;
      }
      
      @keyframes blink {
        50% { opacity: 0; }
      }
      
      /* Boot Screen */
      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0A0E0A;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 40px;
        font-family: 'JetBrains Mono', monospace;
        transition: opacity 0.4s ease;
      }
      
      .boot-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      
      .boot-line {
        font-size: 13px;
        color: #00FF41;
        line-height: 1.8;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      
      .boot-line.visible {
        opacity: 1;
      }
      
      .boot-line .ok {
        color: #00FF41;
      }
      
      .boot-line .dim {
        color: #3A4A3C;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: #0A0E0A;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #1E2820;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #00FF41;
      }
      
      /* Selection */
      ::selection {
        background-color: #00FF41;
        color: #0A0E0A;
      }
      
      /* No rounded corners anywhere */
      *, *::before, *::after {
        border-radius: 0 !important;
      }
      
      html {
        scroll-behavior: smooth;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="font-mono">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
