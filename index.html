
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manish Kumar | Founder @ Eyeva AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              syne: ['Syne', 'sans-serif'],
              inter: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                dark: '#05060a',
                panel: 'rgba(12, 15, 24, 0.85)',
                border: 'rgba(108, 128, 192, 0.25)',
                accent: '#4da3ff',
                glow: '#8a7dff',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #05060a;
        color: #e9ecf4;
        scroll-behavior: smooth;
      }
      .noise::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.04;
        background-image: radial-gradient(circle at 1px 1px, #fff 1px, transparent 0);
        background-size: 4px 4px;
        z-index: 50;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #05060a;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="noise font-inter">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
